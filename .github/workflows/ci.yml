name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: dd_owner
          POSTGRES_PASSWORD: dd_owner
          POSTGRES_DB: dropdesk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dd_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_OWNER_URL: postgres://dd_owner:dd_owner@localhost:5432/dropdesk_test
      DATABASE_URL: postgres://dropdesk_app:dropdesk_app@localhost:5432/dropdesk_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Typecheck (packages + api)
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Database + tenancy tests (AUTH-001 etc.)
        run: npm run test:db
      - name: Build web (includes Next.js type check)
        run: npm run build
      - name: Dependency audit (high+ fails)
        run: npm audit --omit=dev --audit-level=high
